<!doctype html>
<html lang="id">
<head>
<!-- @include head -->
<title>Open PO baru · Jastip Admin</title>
<script type="module" src="js/pages/open-po-form.js"></script>
</head>
<body class="bg-page text-ink antialiased">
<!-- @include lewati -->
<!-- @include topnav aktif=open-po -->
<main id="konten" class="pb-10">
  <header class="sticky top-0 z-20 border-b border-line bg-page">
    <div class="mx-auto flex min-h-14 max-w-lg items-center gap-1 px-2 py-1 md:px-4">
      <a href="index.html" id="tautan-kembali" data-kembali class="{{tombolIkon}}" aria-label="Kembali"><!-- @ikon chevron-left 24 size-6 --></a>
      <h1 id="judul" class="min-w-0 flex-1 text-xl font-semibold break-words">Open PO baru</h1>
    </div>
  </header>
  <div class="mx-auto max-w-lg px-4 pt-4 md:px-6">
    <div data-banner-halaman hidden class="mb-4"></div>
    <div id="memuat" hidden></div>

    <form id="form-po" class="space-y-6" novalidate>
      <div class="space-y-4">
        <div>
          <label for="nama" class="{{label}}">Nama Open PO</label>
          <input id="nama" name="nama" type="text" class="{{input}}" placeholder="mis. Australia Nov 2026" maxlength="100" autocomplete="off" enterkeyhint="done" required>
        </div>

        <div>
          <p class="{{label}}">Mata uang</p>
          <p class="mt-1">AUD (Dolar Australia)</p>
        </div>

        <fieldset id="status-grup" hidden>
          <legend class="{{label}}">Status</legend>
          <div class="{{segmented}}" data-jangkar-error>
            <label class="{{segmentedOpsi}}"><input type="radio" name="status" value="buka" class="{{segmentedRadio}}">Buka</label>
            <label class="{{segmentedOpsi}}"><input type="radio" name="status" value="selesai" class="{{segmentedRadio}}">Selesai</label>
          </div>
        </fieldset>
      </div>

      <fieldset id="kurs-grup" class="space-y-3">
        <legend class="{{label}}">Kurs</legend>
        <div id="kurs-banner" hidden></div>
        <div class="{{segmented}}" data-jangkar-error>
          <label class="{{segmentedOpsi}}"><input type="radio" name="kurs_mode" value="otomatis" class="{{segmentedRadio}}" checked>Otomatis</label>
          <label class="{{segmentedOpsi}}"><input type="radio" name="kurs_mode" value="manual" class="{{segmentedRadio}}">Manual</label>
        </div>

        <div id="panel-otomatis" class="{{kartu}}">
          <div id="kurs-otomatis-isi"></div>
          <button type="button" id="ambil-kurs" class="{{tombolSecondary}} mt-3 w-full md:w-auto">
            <!-- @ikon arrow-path 24 size-5 -->
            Ambil kurs terbaru
          </button>
        </div>

        <div id="panel-manual" hidden>
          <label for="kurs-manual" class="{{label}}">Kurs jastip (Rp per 1 AUD)</label>
          <div class="{{inputGrup}}" data-input-grup>
            <span class="{{imbuhan}} pr-0" aria-hidden="true">Rp</span>
            <input id="kurs-manual" name="kurs_jastip" type="text" inputmode="numeric" class="{{inputDalamGrup}}" autocomplete="off" enterkeyhint="done" aria-describedby="kurs-manual-bantuan">
          </div>
          <p id="kurs-manual-bantuan" class="{{bantuan}}">Angka ini dipakai apa adanya, tanpa buffer.</p>
        </div>
      </fieldset>

      <section id="kurs-terkunci" aria-labelledby="kurs-terkunci-label" hidden></section>

      <div data-banner-form hidden></div>
      <button type="submit" id="tombol-simpan" class="{{tombolPrimary}} w-full md:w-auto">Simpan Open PO</button>
    </form>
  </div>
</main>
<!-- @include toast -->
</body>
</html>
